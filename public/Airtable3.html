<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Produtos / Materiais - Profissional</title>
    <script src="https://developer.api.autodesk.com/modelderivative/v2/viewers/7.96/viewer3D.js"></script>
    <link rel="stylesheet" href="https://developer.api.autodesk.com/modelderivative/v2/viewers/7.96/style.css" />
  <style>

    /* 2-column layout: left content + Autodesk Viewer */
    .split-layout {
    display: flex;
    width: 100%;
    overflow: hidden;  
    }

    /* Left side (your product/material UI) */
    .left-panel {
    width: 50%;
    padding: 1rem;
    overflow-y: auto;
    height: calc(100vh - 140px)
    }

    /* Right side (Autodesk Viewer) */
    .right-panel {
    width: 50%;
    border-left: 2px solid #D5D8DC;
    padding: 0;
    overflow-y: hidden;
    position: relative;
    }

    .viewerContainer {
    position: absolute;
    top: 0;
    left: 0;
    width: 100% !important;
    bottom: 0;
    }

    /* Reset básico */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", Arial, sans-serif;
    }

    body {
      background-color: #F4F6F7; /* Fundo empresarial claro */
      color: #2C3E50;
    }

    /* Navbar */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
      background-color: #2C3E50; /* Azul escuro empresarial */
      box-shadow: 0 5px 10px rgba(0,0,0,0.1);
      color: white;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .navbar .brand {
      font-weight: bold;
      font-size: 1.25rem;
      color: white;
    }

    .navbar ul {
      display: flex;
      gap: 1.5rem;
      list-style: none;
    }

    .navbar a {
      text-decoration: none;
      color: #ECF0F1;
      font-weight: 500;
      transition: opacity 0.2s;
    }

    .navbar a:hover {
      opacity: 0.7;
    }

    #sidebar {
      position: fixed;
      top: 0;
      right: -350px; /* Hidden outside the screen */
      width: 350px;
      height: 100%;
      background-color: #FFFFFF;
      border-left: 1px solid #D5D8DC;
      box-shadow: -4px 0 10px rgba(0,0,0,0.1);
      transition: right 0.3s ease;
      z-index: 2000;
    }

    #sidebar.open {
      right: 0; /* Slides in */
    }

    .sidebar-content {
      padding: 1.5rem;
    }

    #closeSidebar {
      float: right;
      font-size: 1.8rem;
      cursor: pointer;
      color: #2C3E50;
    }

    #closeSidebar:hover {
      color: #2980B9;
    }

    #sidebar h2 {
      margin-top: 0.5rem;
      margin-bottom: 1rem;
      color: #2C3E50;
    }

    #sidebarBody p {
      font-size: 1rem;
      margin-bottom: 0.7rem;
      color: #34495E;
    }

        /* Container principal */
    .container {
      max-width: 1200px;
      margin: 2rem auto;
      padding: 0 1rem;
    }

    /* Toggle de view */
    .toggle-btn {
      margin-bottom: 1.5rem;
      display: flex;
      gap: 0.5rem;
    }

    .toggle-btn button {
      padding: 0.5rem 1rem;
      border: 1px solid #2980B9;
      background-color: white;
      color: #2980B9;
      cursor: pointer;
      border-radius: 0.3rem;
      transition: all 0.2s;
      font-weight: 600;
    }

    .toggle-btn button.active {
      background-color: #2980B9; /* Azul corporativo */
      color: white;
    }

    /* Table styling */
    #tableView {
      width: 100%;
      border-collapse: collapse;
      font-family: Arial, sans-serif;
    }

    #tableView th, #tableView td {
      padding: 12px 15px;
      text-align: left;
      border-bottom: 1px solid #ddd;
    }

    #tableView th {
      background-color: #f4f4f4;
      font-weight: bold;
    }

    /* Actions column styling */
    .actions-col {
      text-align: center; /* center the delete button */
    }

    /* Delete button styling */
    .delete-btn {
      background-color: transparent; /* no background */
      border: none; /* remove default border */
      cursor: pointer;
      font-size: 18px; /* icon size */
      color: #e74c3c; /* red color */
      transition: color 0.2s;
    }

    .delete-btn:hover {
      color: #c0392b; /* darker red on hover */
    }

    /* Optional: hover effect on row */
    #tableView tbody tr:hover {
      background-color: #f9f9f9;
    }

    .toggle-btn2 button {
      padding: 0.5rem 1rem;
      border: 1px solid #229b00;
      background-color: white;
      color: #229b00;
      cursor: pointer;
      border-radius: 0.3rem;
      transition: all 0.2s;
      font-weight: 600;
    }

    .toggle-btn2 button.active {
      background-color: #229b00;
      color: white;
    }

    /* Optional: Add hover effect */
    .toggle-btn2 button:hover {
      background-color: #229b00;
      color: white;
  }

    .toggle-btn2 {
      margin-left: 2rem; /* space between Tabela and Add Product */
    }

      .toggle-btn3 button {
      padding: 0.5rem 1rem;
      border: 1px solid #ff5b5b;
      background-color: white;
      color: #ff5b5b;
      cursor: pointer;
      border-radius: 0.3rem;
      transition: all 0.2s;
      font-weight: 600;
    }

    .toggle-btn3 button.active {
      background-color: #ff5b5b;
      color: white;
    }

    /* Optional: Add hover effect */
    .toggle-btn3 button:hover {
      background-color: #ff5b5b;
      color: white;
  }

  .toggle-btn4 button {
      padding: 0.5rem 1rem;
      border: 1px solid #000000;
      background-color: white;
      color: #000000;
      cursor: pointer;
      border-radius: 0.3rem;
      transition: all 0.2s;
      font-weight: 600;
    }

    .toggle-btn4 button.active {
      background-color: #000000;
      color: white;
    }

    /* Optional: Add hover effect */
    .toggle-btn4 button:hover {
      background-color: #2a2a2a;
      color: white;
    }

    .toggle-btn4 {
      margin-left: 2rem; /* space between Tabela and Add Product */
    }


    .fixed-icon {
      position: fixed;
      bottom: 20px;
      left: 20px;
    }

    .fixed-icon:hover {
      background: #444;
    }

</style>
</head>
<body>

<!-- Navbar -->
  <nav class="navbar">
    <div class="brand">BIMatrix</div>
    <ul>
      <li><a href="Airtable2.html" style="color: #2980B9;"></strong>Produtos</strong></a></li>
      <li><a href="#" id="showNameSidebar">Nome, Empresa</a></li>
            <li><a href="login.html">Sair</a></li>
    </ul>
  </nav>

  <!-- SideBar -->
  <div id="sidebar">
    <div class="sidebar-content">
      <span id="closeSidebar">&times;</span>

      <h2 id="sidebarTitle">Perfil</h2>

      <div id="sidebarBody">
        <!-- Content will change automatically -->
      </div>
    </div>
  </div>

  <div class="split-layout">

    <div class="left-panel">
    <!-- Toggle -->
      <div class="toggle-btn">
        <div class="toggle-btn2">
          <a href="addMaterial.html">
            <button id="addMaterialBtn">Add Product</button>
          </a>
        </div>
        <div class="toggle-btn3">
          <button id="deleteProductBtn">Delete</button>
        </div>
        <div class="toggle-btn4">
          <button>Filter</button>
          <button>Search</button>
        </div>
      </div>

      <table id="tableView">
        <thead>
          <tr>
            <th>Name</th>
            <th>Email</th>
            <th class="actions-col">Actions</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <div class="right-panel">
      <div id="controls">
        <input type="text" id="modelUrn" placeholder="URN" />
        <button id="loadModelBtn">Load Model</button>
      </div>

      <div id="viewerContainer"></div>
        <link rel="stylesheet" href="viewer.css">
        <script src="viewer.js"></script>
      </div>
    </div>  
  </div>

  <script>
    fetch('/api/airtable')
      .then(res => res.json())
      .then(data => {
        const tbody = document.querySelector('#tableView tbody');
        data.records.forEach(record => {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>${record.fields.Name || ''}</td>
            <td>${record.fields.Email || ''}</td>
            <td>
            <td class="actions-col">
              <button class="delete-btn" onclick="deleteRow(this, '${record.id}')">🗑️</button>
            </td>
            `;
          tbody.appendChild(tr);
        });
      })
      .catch(err => console.error(err));
  </script>

  <script>
  async function loadAirtable() {
    try {
      const res = await fetch('/api/airtable');
      const data = await res.json();
      const tbody = document.querySelector('#tableView tbody');
      tbody.innerHTML = ''; // clear table

      data.records.forEach(record => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${record.fields.Name || ''}</td>
          <td>${record.fields.Email || ''}</td>
          <td>
            <button class="delete-btn" data-id="${record.id}">🗑️</button>
          </td>
        `;
        tbody.appendChild(tr);
      });

      // Attach delete events
      document.querySelectorAll('.delete-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
          const id = btn.getAttribute('data-id');
          if (!confirm("Tem certeza que deseja apagar este registro?")) return;

          try {
            await fetch(`/api/delete/${id}`, { method: 'DELETE' });
            alert("Registro apagado!");
            loadAirtable(); // reload table
          } catch (err) {
            console.error(err);
            alert("Erro ao apagar.");
          }
        });
      });

    } catch (err) {
      console.error(err);
    }
  }

  // Load table on page load
  loadAirtable();
  </script>

  <script>
    const gridBtn = document.getElementById('gridBtn');
    const tableBtn = document.getElementById('tableBtn');
    const gridView = document.getElementById('gridView');
    const tableView = document.getElementById('tableView');

    gridBtn.onclick = () => {
      gridView.style.display = "grid";
      tableView.style.display = "none";
      gridBtn.classList.add("active");
      tableBtn.classList.remove("active");
    };

    tableBtn.onclick = () => {
      gridView.style.display = "none";
      tableView.style.display = "block";
      tableBtn.classList.add("active");
      gridBtn.classList.remove("active");
    };

    const sidebar = document.getElementById("sidebar");
    const sidebarTitle = document.getElementById("sidebarTitle");
    const sidebarBody = document.getElementById("sidebarBody");

    document.getElementById("showNameSidebar").addEventListener("click", () => {
      sidebarTitle.textContent = "Perfil";
      sidebarBody.innerHTML = `
        <p><strong>Nome:</strong> João Silva</p>
        <p><strong>Cargo:</strong> Gestor</p>
        <p><strong>Email:</strong> joao@empresa.com</p>
      `;
      sidebar.classList.add("open");
    });

    document.getElementById("closeSidebar").addEventListener("click", () => {
      sidebar.classList.remove("open");
    });
  </script>

</body>
</html>
