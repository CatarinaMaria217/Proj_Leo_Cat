<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Produtos / Materiais</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #F8F9FA; /* Fundo claro */
      color: #333333;
    }
    .navbar-custom {
      background-color: #1E2A38; /* Azul escuro */
    }
    .navbar-custom .nav-link, .navbar-custom .navbar-brand {
      color: #FFFFFF;
    }
    .card-custom {
      background-color: #FFFFFF;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      border-radius: 0.5rem;
      transition: transform 0.2s;
    }
    .card-custom:hover {
      transform: translateY(-5px);
    }
    .toggle-btn {
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-custom px-3">
    <a class="navbar-brand" href="#">Minha Loja</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarContent">
      <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
        <li class="nav-item"><a class="nav-link" href="#">Matérias</a></li>
        <li class="nav-item"><a class="nav-link" href="#">Produtos</a></li>
        <li class="nav-item"><a class="nav-link" href="#">View Type</a></li>
        <li class="nav-item"><a class="nav-link" href="#">Nome</a></li>
        <li class="nav-item"><a class="nav-link" href="#">Empresa</a></li>
      </ul>
    </div>
  </nav>

  <!-- Conteúdo principal -->
  <div class="container my-4">
    <!-- Botão de toggle view -->
    <div class="d-flex justify-content-end toggle-btn">
      <button id="gridViewBtn" class="btn btn-primary me-2">Grid</button>
      <button id="tableViewBtn" class="btn btn-outline-primary">Tabela</button>
    </div>

    <!-- Grid de ícones -->
    <div id="gridView" class="row g-3">
      <div class="col-sm-6 col-md-4 col-lg-3">
        <div class="card card-custom p-3 text-center">
          <img src="https://via.placeholder.com/80" class="mx-auto mb-2" alt="Produto">
          <h5>Produto 1</h5>
          <p>Empresa A</p>
        </div>
      </div>
      <div class="col-sm-6 col-md-4 col-lg-3">
        <div class="card card-custom p-3 text-center">
          <img src="https://via.placeholder.com/80" class="mx-auto mb-2" alt="Produto">
          <h5>Produto 2</h5>
          <p>Empresa B</p>
        </div>
      </div>
      <!-- Mais cards aqui -->
    </div>

    <!-- Tabela -->
    <div id="tableView" class="table-responsive" style="display:none;">
      <table class="table table-striped table-hover">
        <thead class="table-dark">
          <tr>
            <th>Produto</th>
            <th>Nome</th>
            <th>Empresa</th>
            <th>Categoria</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>Produto 1</td>
            <td>Nome 1</td>
            <td>Empresa A</td>
            <td>Matéria X</td>
          </tr>
          <tr>
            <td>Produto 2</td>
            <td>Nome 2</td>
            <td>Empresa B</td>
            <td>Matéria Y</td>
          </tr>
          <!-- Mais linhas aqui -->
        </tbody>
      </table>
    </div>
  </div>

  <!-- Bootstrap JS e Popper -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const gridBtn = document.getElementById('gridViewBtn');
    const tableBtn = document.getElementById('tableViewBtn');
    const gridView = document.getElementById('gridView');
    const tableView = document.getElementById('tableView');

    gridBtn.addEventListener('click', () => {
      gridView.style.display = 'flex';
      tableView.style.display = 'none';
      gridBtn.classList.add('btn-primary');
      gridBtn.classList.remove('btn-outline-primary');
      tableBtn.classList.remove('btn-primary');
      tableBtn.classList.add('btn-outline-primary');
    });

    tableBtn.addEventListener('click', () => {
      gridView.style.display = 'none';
      tableView.style.display = 'block';
      tableBtn.classList.add('btn-primary');
      tableBtn.classList.remove('btn-outline-primary');
      gridBtn.classList.remove('btn-primary');
      gridBtn.classList.add('btn-outline-primary');
    });
  </script>

</body>
</html>
