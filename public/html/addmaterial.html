<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Product - Portal Empresarial</title>
  <link rel="stylesheet" href="../css/addmaterial.css">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <div class="brand">BIMatrix</div>
    <ul>
      <li><a href="Airtable3.html">Voltar</a></li>
    </ul>
  </nav>

  <!-- Form Container -->
  <div class="container">
    <h2>Adicionar novo registro</h2>
    <form id="addForm">
      <div class="form-group">
        <input type="text" id="name" placeholder="Nome" required>
      </div>
      <div class="form-group">
        <input type="text" id="dimensions" placeholder="Dimensões" required>
      </div>
      <div class="form-group">
        <input type="text" id="material" placeholder="Material" required>
      </div>
      <div class="form-group">
        <input type="number" id="price" placeholder="Preço" required step="0.01">
      </div>

      <button class="submit-btn" type="submit">Adicionar</button>
    </form>
  </div>

<script src="../js/addmaterial.js"></script>

</body>
</html>
