<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página de Materiais</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .sidebar-left {
            background-color: #172459;
            color: white;
            min-height: 100vh;
            padding: 20px;
        }
        .sidebar-left button {
            width: 100%;
            margin-bottom: 10px;
            background: none;
            border: none;
            color: white;
            text-align: left;
        }
        .sidebar-right {
            background-color: #505050;
            color: white;
            min-height: 100vh;
            padding: 20px;
        }
        .sidebar-right button {
            width: 100%;
            margin-bottom: 10px;
            background: none;
            border: none;
            color: white;
            text-align: left;
        }
        .product-grid img {
            width: 100%;
            border: 2px solid #cce0ff;
            border-radius: 5px;
        }
        .add-button {
            background-color: #ffcccc;
            font-weight: bold;
            text-align: center;
            padding: 15px;
            border-radius: 5px;
            margin-top: 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Left Sidebar -->
            <div class="col-md-2 sidebar-left">
                <div class="text-center mb-3">
                </div>
                <button>PRODUTOS</button>
                <button>MATERIAIS</button>
                <button>COLABORADORES</button>
            </div>

            <!-- Main Content -->
            <div class="col-md-8 p-4">
                <h3>Procurar:</h3>
                <p>Os seus materiais/ produtos por tipo, ex: sanita</p>
                <input type="text" class="form-control mb-4" placeholder="Digite para buscar...">

                <div class="row g-3 product-grid">
                    <div class="col-md-4"><div class="placeholder bg-secondary text-white text-center p-5">Produto 1</div></div>
                    <div class="col-md-4"><div class="placeholder bg-secondary text-white text-center p-5">Produto 2</div></div>
                    <div class="col-md-4"><div class="placeholder bg-secondary text-white text-center p-5">Produto 3</div></div>
                    <div class="col-md-4"><div class="placeholder bg-secondary text-white text-center p-5">Produto 4</div></div>
                    <div class="col-md-4"><div class="placeholder bg-secondary text-white text-center p-5">Produto 5</div></div>
                    <div class="col-md-4"><div class="placeholder bg-secondary text-white text-center p-5">Produto 6</div></div>
                    <div class="col-md-4"><div class="placeholder bg-secondary text-white text-center p-5">Produto 7</div></div>
                    <div class="col-md-4"><div class="placeholder bg-secondary text-white text-center p-5">Produto 8</div></div>
                    <div class="col-md-4"><div class="placeholder bg-secondary text-white text-center p-5">Produto 9</div></div>
                </div>

                <div class="add-button">ADICIONAR MATERIAL/ PRODUTO</div>
            </div>

            <!-- Right Sidebar -->
            <div class="col-md-2 sidebar-right">
                <div class="text-center mb-3">
                </div>
                <button>LOGOUT</button>
                <button>MEUS PROJETOS</button>
                <button>DOWNLOADS</button>
                <button>MUDAR PASSWORD</button>
                <button>USERNAME</button>
                <button>CHAT</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
